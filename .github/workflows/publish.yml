name: Publish

# Publishes Leiftur.Client to nuget.org when a version tag is pushed, e.g. v0.1.0.
# The tag must match <Version> in src/Leiftur.Client/Leiftur.Client.csproj.
#
# No API key is stored. nuget.org trusts this workflow file in this repository
# (Trusted Publishing) and hands out a key that lasts one hour.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # lets the job ask GitHub for the token nuget.org checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: dotnet pack src/Leiftur.Client --no-build --configuration Release --output artifacts

      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package="artifacts/Leiftur.Client.${TAG#v}.nupkg"
          if [ ! -f "$package" ]; then
            echo "::error::Tag $TAG does not match the version in Leiftur.Client.csproj. Built: $(ls artifacts)"
            exit 1
          fi
          echo "PACKAGE=$package" >> "$GITHUB_ENV"

      # Asked for last, because the key is only valid for an hour.
      - name: Get a short-lived nuget.org key
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }} # the nuget.org profile name, not an email address

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "$PACKAGE" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
